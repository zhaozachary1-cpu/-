<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面试记录仪</title><style>
:root{--bg:#0a1020;--panel:#131d37;--line:#2a3960;--txt:#f4f7ff;--muted:#99a8c6;--p:#7168ff;--cyan:#42d7d2;--orange:#f6a35e;--red:#ff6d88;--green:#62e3a3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:980px;color:var(--txt);background:radial-gradient(circle at 90% 0,#5147bd3d,transparent 30%),var(--bg)}.app{display:grid;grid-template-columns:210px 1fr 340px;gap:18px;padding:18px;min-height:100vh}.card{background:linear-gradient(145deg,#192441ed,#10182ded);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px #0004}aside{padding:19px 13px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:800;padding:5px 8px 28px}.brand:before{content:"✦";color:var(--cyan);margin-right:8px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);margin:4px 0 0 25px}.label{padding:9px;color:#7383aa;font-size:10px;letter-spacing:1px}.nav button{display:block;width:100%;border:0;background:none;color:var(--muted);padding:11px 10px;text-align:left;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#7168ff22;color:#fff}.nav b{float:right}.tip{margin-top:auto;padding:15px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.tip b{display:block;color:#fff;margin-bottom:4px}main{display:flex;flex-direction:column;gap:18px}.top{padding:15px 20px;min-height:74px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:1.2px;font-weight:700}.top h1{font-size:18px;margin:4px 0 0}.button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;color:#fff;cursor:pointer;transition:.18s}.button:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary{background:linear-gradient(135deg,#796fff,#4e77ec)}.secondary{background:#ffffff0b;color:#cfd9f7;border:1px solid var(--line)}.intro{padding:24px;position:relative;overflow:hidden}.intro:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 70%,#42d7d220,transparent 24%),linear-gradient(125deg,transparent 55%,#7168ff12);pointer-events:none}.intro>*{position:relative}.intro h2{font-size:24px;margin:8px 0}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.pill{display:inline-block;margin-top:17px;padding:8px 10px;border:1px solid #4bd8d344;border-radius:9px;color:#bdeeed;font-size:11px;background:#42d7d20d}.list-panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h3{font-size:14px;margin:0}.head span{font-size:11px;color:var(--muted)}.records{display:flex;flex-direction:column;gap:9px}.record{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid transparent;background:#0911269c;border-radius:13px;cursor:pointer;transition:.18s}.record:hover,.record.selected{border-color:#687ee1;transform:translateX(2px)}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#7168ff20;color:#b5c3ff;font-weight:800}.record strong{display:block;font-size:12px}.record span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.badge{padding:5px 7px;border-radius:99px;font-size:10px}.pending{color:var(--orange);background:#f6a35e18}.waiting{color:#c5a9ff;background:#ad91ff18}.offer{color:var(--green);background:#62e3a318}.failed{color:var(--red);background:#ff6d8818}.detail{padding:20px;overflow:auto;max-height:calc(100vh - 36px)}.detail h2{font-size:21px;margin:17px 0 4px}.role{color:var(--muted);font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:19px 0}.meta div{padding:10px;background:#0911269c;border-radius:10px;color:var(--muted);font-size:10px}.meta b{display:block;color:#fff;font-size:11px;margin-top:5px}.section{margin-top:20px;font-size:13px;font-weight:700}.note{margin-top:10px;padding:13px;background:#6074e910;border:1px solid #6074e955;border-radius:13px;line-height:1.7;font-size:11px;color:#cbd6ee}.note b{display:block;color:#fff;margin-bottom:5px}.links{display:flex;gap:14px;margin-top:15px}.link{border:0;background:none;padding:0;color:#aac5ff;font-size:11px;cursor:pointer}.link.danger{color:#ff8ea4}dialog{width:650px;color:#fff;background:#121b36;border:1px solid #5971c2;border-radius:18px;padding:0;box-shadow:0 30px 90px #000a}dialog::backdrop{background:#020714ae;backdrop-filter:blur(5px)}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font-size:17px;margin:4px 0 0}.close{border:0;background:#ffffff12;color:white;width:28px;height:28px;border-radius:8px;font-size:18px;cursor:pointer}form{padding:21px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select,textarea{font:13px inherit;color:#fff;background:#091026;border:1px solid var(--line);border-radius:10px;padding:11px}input[readonly]{color:#b8c7eb;background:#111b35}textarea{min-height:118px;resize:vertical}.lookup{display:flex;gap:8px}.lookup input{flex:1}.lookup .button{white-space:nowrap}.query-status{font-size:10px;color:var(--muted);margin-top:-4px}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.cancel{border:0;background:none;color:var(--muted);padding:10px;cursor:pointer}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#1d2d58;border:1px solid #6580d4;border-radius:10px;padding:11px 15px;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app"><aside class="card"><div class="brand">面试记录仪<small>INTERVIEW ATLAS</small></div><div class="label">工作台</div><nav class="nav"><button class="active">概览</button><button>面试看板</button><button>AI 复盘</button></nav><div class="label">状态筛选</div><nav class="nav"><button data-filter="待面试">待面试 <b id="n-pending">0</b></button><button data-filter="等待反馈">等待反馈 <b id="n-waiting">0</b></button><button data-filter="获得offer">获得offer <b id="n-offer">0</b></button><button data-filter="未通过">未通过 <b id="n-failed">0</b></button></nav><div class="tip"><b>公司信息自动补全</b>通过企查查查询注册地址与行业</div></aside><main><header class="top card"><div><div class="eyebrow">INTERVIEW DASHBOARD</div><h1>记录每一次面试，沉淀每一次成长</h1></div><button class="button primary" id="add">＋ 新增面试记录</button></header><section class="intro card"><div class="eyebrow">SMART COMPANY LOOKUP</div><h2>公司信息，自动补全</h2><p>录入公司名称后查询企查查的注册地址与所属行业。<br>确认后，这些信息会在提交时保存到对应公司的信息模块。</p><span class="pill">企查查服务已接入 · 凭证仅保留在本地服务端</span></section><section class="card list-panel"><div class="head"><h3>面试记录</h3><span id="count"></span></div><div class="records" id="records"></div></section></main><section class="card detail" id="detail"></section></div><dialog id="recordDialog"><div class="modal-head"><div><div class="eyebrow">INTERVIEW RECORD</div><h2 id="recordTitle">新增面试记录</h2></div><button class="close" data-close="recordDialog">×</button></div><form id="recordForm"><div class="field full"><label>公司名称 *</label><div class="lookup"><input required name="company" placeholder="输入公司全称，例如：小红书科技有限公司"><button class="button secondary" type="button" id="lookup">查询公司信息</button></div><div id="lookupStatus" class="query-status">输入公司名称后，点击查询自动回填。</div></div><div class="field"><label>详细地址</label><input name="location" readonly placeholder="企查查查询后自动填充"></div><div class="field"><label>所属行业</label><input name="industry" readonly placeholder="企查查查询后自动填充"></div><div class="field"><label>面试岗位 *</label><input required name="role" placeholder="例如：增长产品经理"></div><div class="field"><label>面试状态 *</label><select name="status"><option>待面试</option><option>等待反馈</option><option>获得offer</option><option>未通过</option></select></div><div class="field"><label>面试日期时间 *</label><input required type="datetime-local" name="date"></div><div class="field"><label>公司产品 / 业务</label><input name="product" readonly placeholder="查询后可能自动填充"></div><div class="actions"><button type="button" class="cancel" data-close="recordDialog">取消</button><button class="button primary">保存记录</button></div></form></dialog><dialog id="summaryDialog"><div class="modal-head"><div><div class="eyebrow">INTERVIEW SUMMARY</div><h2>上传面试总结纪要</h2></div><button class="close" data-close="summaryDialog">×</button></div><form id="summaryForm"><div class="field full"><label>关联面试记录</label><select name="recordId" id="summarySelect"></select></div><div class="field full"><label>总结纪要 / 转写稿 *</label><textarea required name="notes" placeholder="粘贴录音转写、会议纪要或复盘内容。"></textarea></div><div class="actions"><button type="button" class="cancel" data-close="summaryDialog">取消</button><button class="button primary">保存纪要</button></div></form></dialog><div id="toast" class="toast"></div><script>
const initial=[{id:'1',company:'小红书',role:'增长产品经理',status:'待面试',date:'2026-07-31T14:00',location:'北京市朝阳区望京街10号',industry:'互联网和相关服务',product:'内容社区与生活方式平台',notes:''},{id:'2',company:'字节跳动',role:'用户产品经理',status:'等待反馈',date:'2026-07-26T10:30',location:'北京市海淀区北三环西路',industry:'互联网',product:'抖音、飞书',notes:'已完成业务面，等待后续反馈。'}];let records=JSON.parse(localStorage.getItem('interview-atlas-v3')||'null')||initial,selected=records[0],editing=null;const $=s=>document.querySelector(s),map={待面试:'pending',等待反馈:'waiting',获得offer:'offer',未通过:'failed'},esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),time=d=>new Date(d).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});function save(){localStorage.setItem('interview-atlas-v3',JSON.stringify(records))}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}function draw(){Object.keys(map).forEach(s=>$('#n-'+map[s]).textContent=records.filter(r=>r.status===s).length);$('#count').textContent=`共 ${records.length} 条`;$('#records').innerHTML=records.map(r=>`<article class="record ${r.id===selected.id?'selected':''}" data-id="${r.id}"><div class="avatar">${esc(r.company[0])}</div><div><strong>${esc(r.company)} · ${esc(r.role)}</strong><span>${time(r.date)} · ${esc(r.location)}</span></div><i class="badge ${map[r.status]}">${r.status}</i></article>`).join('');document.querySelectorAll('.record').forEach(e=>e.onclick=()=>{selected=records.find(r=>r.id===e.dataset.id);draw()});$('#detail').innerHTML=`<div class="eyebrow">COMPANY INFO</div><h2>${esc(selected.company)}</h2><div class="role">${esc(selected.role)}</div><i class="badge ${map[selected.status]}" style="display:inline-block;margin-top:12px">${selected.status}</i><div class="meta"><div>面试日期时间<b>${time(selected.date)}</b></div><div>详细地址<b>${esc(selected.location||'待补充')}</b></div><div>所属行业<b>${esc(selected.industry||'待补充')}</b></div><div>公司产品 / 业务<b>${esc(selected.product||'待补充')}</b></div></div><div class="section">面试总结纪要</div><div class="note"><b>${selected.notes?'已上传':'尚未上传纪要'}</b>${esc(selected.notes||'可从“上传 / 更新纪要”补充录音转写与复盘内容。')}</div><div class="links"><button class="link" id="edit">编辑记录</button><button class="link" id="summary">上传 / 更新纪要</button><button class="link danger" id="remove">删除</button></div>`;$('#edit').onclick=()=>openRecord(selected);$('#summary').onclick=()=>openSummary(selected.id);$('#remove').onclick=()=>{if(confirm('确定删除该记录吗？')){records=records.filter(r=>r.id!==selected.id);selected=records[0];save();draw();toast('记录已删除')}}}function openRecord(r){editing=r?.id||null;$('#recordTitle').textContent=r?'编辑面试记录':'新增面试记录';const f=$('#recordForm');f.reset();$('#lookupStatus').textContent='输入公司名称后，点击查询自动回填。';if(r)Object.keys(r).forEach(k=>f.elements[k]&&(f.elements[k].value=r[k]||''));$('#recordDialog').showModal()}function openSummary(id){const s=$('#summarySelect');s.innerHTML=records.map(r=>`<option value="${r.id}">${esc(r.company)} · ${esc(r.role)}</option>`).join('');const r=records.find(x=>x.id===id)||selected;s.value=r.id;$('#summaryForm').elements.notes.value=r.notes||'';$('#summaryDialog').showModal()}$('#add').onclick=()=>openRecord();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#lookup').onclick=async()=>{const f=$('#recordForm'),name=f.elements.company.value.trim(),status=$('#lookupStatus');if(!name)return toast('请先输入公司名称');status.textContent='正在查询企查查公司信息…';try{const r=await fetch('/api/company?name='+encodeURIComponent(name));const d=await r.json();if(!r.ok)throw Error(d.error);f.elements.company.value=d.name||name;f.elements.location.value=d.address||'';f.elements.industry.value=d.industry||'';f.elements.product.value=d.product||'';status.textContent='查询成功：已回填详细地址和所属行业。'}catch(e){status.textContent=e.message||'查询失败，请稍后重试。'}};$('#recordForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(editing){records=records.map(r=>r.id===editing?{...r,...d}:r);selected=records.find(r=>r.id===editing);toast('记录已更新')}else{selected={...d,id:Date.now().toString(),notes:''};records.unshift(selected);toast('记录已保存')}save();draw();$('#recordDialog').close()};$('#summaryForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));records=records.map(r=>r.id===d.recordId?{...r,notes:d.notes}:r);selected=records.find(r=>r.id===d.recordId);save();draw();$('#summaryDialog').close();toast('面试纪要已保存')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const found=records.find(r=>r.status===b.dataset.filter);if(found){selected=found;draw()}else toast('暂无该状态的记录')});draw();
</script></body></html>
