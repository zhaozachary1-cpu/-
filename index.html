<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1020">
  <title>面试记录仪</title>
  <style>
    :root{--bg:#0a1020;--panel:#131d37;--line:#2a3960;--txt:#f4f7ff;--muted:#99a8c6;--p:#7168ff;--cyan:#42d7d2;--orange:#f6a35e;--red:#ff6d88;--green:#62e3a3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--txt);background:radial-gradient(circle at 90% 0,#5147bd3d,transparent 30%),var(--bg)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:210px minmax(0,1fr) 340px;gap:18px;padding:18px;min-height:100vh}.card{background:linear-gradient(145deg,#192441ed,#10182ded);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px #0004}aside{padding:19px 13px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:800;padding:5px 8px 28px}.brand:before{content:"✦";color:var(--cyan);margin-right:8px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);margin:4px 0 0 25px}.label{padding:9px;color:#7383aa;font-size:10px;letter-spacing:1px}.nav button{display:block;width:100%;border:0;background:none;color:var(--muted);padding:11px 10px;text-align:left;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#7168ff22;color:#fff}.nav b{float:right}.tip{margin-top:auto;padding:15px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.tip b{display:block;color:#fff;margin-bottom:4px}main{display:flex;flex-direction:column;gap:18px;min-width:0}.top{padding:15px 20px;min-height:74px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:1.2px;font-weight:700}.top h1{font-size:18px;margin:4px 0 0}.button{min-height:44px;border:0;border-radius:11px;padding:11px 14px;font-weight:700;color:#fff;cursor:pointer;transition:.18s}.button:hover{transform:translateY(-2px);filter:brightness(1.1)}.button:active{transform:scale(.97)}.primary{background:linear-gradient(135deg,#796fff,#4e77ec)}.secondary{background:#ffffff0b;color:#cfd9f7;border:1px solid var(--line)}.list-panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h3{font-size:14px;margin:0}.head span{font-size:11px;color:var(--muted)}.records{display:flex;flex-direction:column;gap:9px}.record{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid transparent;background:#0911269c;border-radius:13px;cursor:pointer;transition:.18s}.record:hover,.record.selected{border-color:#687ee1;transform:translateX(2px)}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#7168ff20;color:#b5c3ff;font-weight:800}.record strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record span{display:block;color:var(--muted);font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{padding:5px 7px;border-radius:99px;font-size:10px}.pending{color:var(--orange);background:#f6a35e18}.waiting{color:#c5a9ff;background:#ad91ff18}.offer{color:var(--green);background:#62e3a318}.failed{color:var(--red);background:#ff6d8818}.detail{padding:20px;overflow:auto;max-height:calc(100vh - 36px)}.detail h2{font-size:21px;margin:17px 0 4px}.role{color:var(--muted);font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:19px 0}.meta div{padding:10px;background:#0911269c;border-radius:10px;color:var(--muted);font-size:10px}.meta b{display:block;color:#fff;font-size:11px;margin-top:5px}.section{margin-top:20px;font-size:13px;font-weight:700}.note{margin-top:10px;padding:13px;background:#6074e910;border:1px solid #6074e955;border-radius:13px;line-height:1.7;font-size:11px;color:#cbd6ee}.note b{display:block;color:#fff;margin-bottom:5px}.links{display:flex;gap:14px;margin-top:15px}.link{border:0;background:none;padding:6px 0;color:#aac5ff;font-size:11px;cursor:pointer}.link.danger{color:#ff8ea4}.empty-state{display:grid;place-items:center;text-align:center;min-height:210px;padding:28px 18px;border:1px dashed #40527f;border-radius:14px;background:#0b143025}.empty-state .empty-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#7168ff20;color:#adaaff;font-size:23px;margin-bottom:12px}.empty-state h3{margin:0;font-size:15px}.empty-state p{max-width:270px;margin:8px 0 16px;color:var(--muted);font-size:11px;line-height:1.6}dialog{width:min(650px,calc(100vw - 32px));max-height:calc(100dvh - 32px);color:#fff;background:#121b36;border:1px solid #5971c2;border-radius:18px;padding:0;box-shadow:0 30px 90px #000a}dialog::backdrop{background:#020714ae;backdrop-filter:blur(5px)}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font-size:17px;margin:4px 0 0}.close{border:0;background:#ffffff12;color:white;width:32px;height:32px;border-radius:9px;font-size:20px;cursor:pointer}form{padding:21px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;font-size:13px;color:#fff;background:#091026;border:1px solid var(--line);border-radius:10px;padding:11px}input[readonly]{color:#b8c7eb;background:#111b35}textarea{min-height:118px;resize:vertical}.lookup{display:flex;gap:8px}.lookup input{flex:1}.lookup .button{white-space:nowrap}.query-status{font-size:10px;color:var(--muted);margin-top:-4px}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.cancel{border:0;background:none;color:var(--muted);padding:10px;cursor:pointer}.toast{position:fixed;z-index:20;bottom:max(25px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#1d2d58;border:1px solid #6580d4;border-radius:10px;padding:11px 15px;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <div class="app">
    <aside class="card"><div class="brand">面试记录仪<small>INTERVIEW ATLAS</small></div><div class="label">工作台</div><nav class="nav"><button class="active">概览</button><button>面试看板</button><button>AI 复盘</button></nav><div class="label">状态筛选</div><nav class="nav"><button data-filter="待面试">待面试 <b id="n-pending">0</b></button><button data-filter="等待反馈">等待反馈 <b id="n-waiting">0</b></button><button data-filter="获得offer">获得offer <b id="n-offer">0</b></button><button data-filter="未通过">未通过 <b id="n-failed">0</b></button></nav><div class="tip"><b>公司信息自动补全</b>通过企查查查询注册地址与行业</div></aside>
    <main><header class="top card"><div><div class="eyebrow">INTERVIEW DASHBOARD</div><h1>记录每一次面试，沉淀每一次成长</h1></div><button class="button primary" id="add">＋ 新增面试记录</button></header><section class="intro card" aria-hidden="true"></section><section class="card list-panel"><div class="head"><h3>面试记录</h3><span id="count"></span></div><div class="records" id="records"></div></section></main>
    <section class="card detail" id="detail"></section>
  </div>
  <dialog id="recordDialog"><div class="modal-head"><div><div class="eyebrow">INTERVIEW RECORD</div><h2 id="recordTitle">新增面试记录</h2></div><button class="close" data-close="recordDialog" aria-label="关闭">×</button></div><form id="recordForm"><div class="field full"><label>公司名称 *</label><div class="lookup"><input required name="company" placeholder="输入公司全称，例如：小红书科技有限公司"><button class="button secondary" type="button" id="lookup">查询公司信息</button></div><div id="lookupStatus" class="query-status">输入公司名称后，点击查询自动回填。</div></div><div class="field"><label>详细地址</label><input name="location" readonly placeholder="企查查查询后自动填充"></div><div class="field"><label>所属行业</label><input name="industry" readonly placeholder="企查查查询后自动填充"></div><div class="field"><label>面试岗位 *</label><input required name="role" placeholder="例如：增长产品经理"></div><div class="field"><label>面试状态 *</label><select name="status"><option>待面试</option><option>等待反馈</option><option>获得offer</option><option>未通过</option></select></div><div class="field"><label>面试日期时间 *</label><input required type="datetime-local" name="date"></div><div class="field"><label>公司产品 / 业务</label><input name="product" readonly placeholder="查询后可能自动填充"></div><div class="actions"><button type="button" class="cancel" data-close="recordDialog">取消</button><button class="button primary">保存记录</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const initial=[];
    let records=JSON.parse(localStorage.getItem('interview-atlas-v3')||'null')||initial,selected=records[0]||null,editing=null;
    const $=s=>document.querySelector(s),map={待面试:'pending',等待反馈:'waiting',获得offer:'offer',未通过:'failed'},esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),time=d=>d?new Date(d).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'待补充';
    function save(){localStorage.setItem('interview-atlas-v3',JSON.stringify(records))}
    function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
    function emptyDetail(){return '<div class="eyebrow">COMPANY INFO</div><div class="empty-state"><div class="empty-icon">＋</div><h3>从第一场面试开始记录</h3><p>新增一条面试记录后，公司地址、行业和面试问答都会集中在这里。</p><button class="button primary" id="emptyAdd">新增面试记录</button></div>'}
    function draw(){
      if(!selected && records.length) selected=records[0];
      Object.keys(map).forEach(s=>{const node=$('#n-'+map[s]);if(node)node.textContent=records.filter(r=>r.status===s).length});
      $('#count').textContent=`共 ${records.length} 条`;
      $('#records').innerHTML=records.length?records.map(r=>`<article class="record ${r.id===selected?.id?'selected':''}" data-id="${r.id}"><div class="avatar">${esc(r.company?.[0]||'企')}</div><div><strong>${esc(r.company)} · ${esc(r.role)}</strong><span>${time(r.date)} · ${esc(r.location||'地址待补充')}</span></div><i class="badge ${map[r.status]||'waiting'}">${esc(r.status||'等待反馈')}</i></article>`).join(''):'<div class="empty-state"><div class="empty-icon">✦</div><h3>还没有面试记录</h3><p>从新增一条记录开始，建立属于你的面试复盘库。</p><button class="button primary" id="emptyListAdd">新增第一条记录</button></div>';
      document.querySelectorAll('.record').forEach(e=>e.onclick=()=>{selected=records.find(r=>r.id===e.dataset.id)||null;draw()});
      $('#emptyListAdd')?.addEventListener('click',()=>openRecord());
      $('#detail').innerHTML=selected?`<div class="eyebrow">COMPANY INFO</div><h2>${esc(selected.company)}</h2><div class="role">${esc(selected.role)}</div><i class="badge ${map[selected.status]||'waiting'}" style="display:inline-block;margin-top:12px">${esc(selected.status||'等待反馈')}</i><div class="meta"><div>面试日期时间<b>${time(selected.date)}</b></div><div>详细地址<b>${esc(selected.location||'待补充')}</b></div><div>所属行业<b>${esc(selected.industry||'待补充')}</b></div><div>公司产品 / 业务<b>${esc(selected.product||'待补充')}</b></div></div><div class="links"><button class="link" id="edit">编辑记录</button><button class="link danger" id="remove">删除</button></div>`:emptyDetail();
      $('#emptyAdd')?.addEventListener('click',()=>openRecord());
      if(selected){$('#edit').onclick=()=>openRecord(selected);$('#remove').onclick=()=>{if(confirm('确定删除该记录吗？')){records=records.filter(r=>r.id!==selected.id);selected=records[0]||null;save();draw();toast('记录已删除')}}}
    }
    function openRecord(r){editing=r?.id||null;$('#recordTitle').textContent=r?'编辑面试记录':'新增面试记录';const f=$('#recordForm');f.reset();$('#lookupStatus').textContent='输入公司名称后，点击查询自动回填。';if(r)Object.keys(r).forEach(k=>f.elements[k]&&(f.elements[k].value=r[k]||''));$('#recordDialog').showModal()}
    function openSummary(id){if(!records.length)return toast('请先新增一条面试记录');const s=$('#summarySelect');s.innerHTML=records.map(r=>`<option value="${r.id}">${esc(r.company)} · ${esc(r.role)}</option>`).join('');const r=records.find(x=>x.id===id)||selected;s.value=r.id;$('#summaryDialog').showModal()}
    $('#add').onclick=()=>openRecord();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
    $('#lookup').onclick=async()=>{const f=$('#recordForm'),name=f.elements.company.value.trim(),status=$('#lookupStatus');if(!name)return toast('请先输入公司名称');status.textContent='正在查询企查查公司信息…';try{const r=await fetch('/api/company?name='+encodeURIComponent(name)),d=await r.json();if(!r.ok)throw Error(d.error);f.elements.company.value=d.name||name;f.elements.location.value=d.address||'';f.elements.industry.value=d.industry||'';f.elements.product.value=d.product||'';status.textContent='查询成功：已回填详细地址和所属行业。'}catch(e){status.textContent=e.message||'查询失败，请稍后重试。'}};
    $('#recordForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(editing){records=records.map(r=>r.id===editing?{...r,...d}:r);selected=records.find(r=>r.id===editing)||null;toast('记录已更新')}else{selected={...d,id:Date.now().toString(),notes:'',qa:[],qaText:''};records.unshift(selected);toast('记录已保存')}save();draw();$('#recordDialog').close()};
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const found=records.find(r=>r.status===b.dataset.filter);if(found){selected=found;draw()}else toast('暂无该状态的记录')});draw();
  </script>
</body>
</html>
